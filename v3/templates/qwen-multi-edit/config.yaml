# ==============================================================================
# Qwen-Image-Edit-2511 Template Configuration
# Ultra-fast image editing with Lightning acceleration
# ==============================================================================

name: qwen-multi-edit
version: 2.0.0
description: Qwen-Image-Edit-2511 with Lightning 4-step and 8-step LoRAs
gpu_requirement: 24GB

# ComfyUI arguments (SPEED OPTIMIZED for RTX 40/50)
# See: https://docs.comfy.org/cli
comfy_args:
  - --enable-manager           # pip-integrated ComfyUI-Manager
  - --fast fp8_matrix_mult     # FP8 matrix ops (safe, +40% on RTX 40/50)
  - --fast autotune            # PyTorch autotuner
  - --highvram                 # Keep models in GPU (no CPU offload)
  - --use-sage-attention       # INT8 quantized attention (2-4x faster)
  - --preview-method auto      # Fast preview generation

# ==============================================================================
# Models - OFFICIAL URLs from ComfyUI docs
# https://docs.comfy.org/tutorials/image/qwen/qwen-image-edit-2511
# ==============================================================================
models:
  # ---------------------------------------------------------------------------
  # QWEN 2511 DIFFUSION MODEL (BF16 - official)
  # ---------------------------------------------------------------------------
  - source: huggingface
    repo: Comfy-Org/Qwen-Image-Edit_ComfyUI
    file: split_files/diffusion_models/qwen_image_edit_2511_bf16.safetensors
    path: diffusion_models

  # ---------------------------------------------------------------------------
  # TEXT ENCODER (from HunyuanVideo repo - official)
  # ---------------------------------------------------------------------------
  - source: huggingface
    repo: Comfy-Org/HunyuanVideo_1.5_repackaged
    file: split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
    path: text_encoders

  # ---------------------------------------------------------------------------
  # VAE
  # ---------------------------------------------------------------------------
  - source: huggingface
    repo: Comfy-Org/Qwen-Image_ComfyUI
    file: split_files/vae/qwen_image_vae.safetensors
    path: vae

  # ---------------------------------------------------------------------------
  # LIGHTNING LORAS (Step Distillation for 10x Speed)
  # ---------------------------------------------------------------------------
  
  # Lightning 4-step LoRA (OFFICIAL - bf16)
  - source: huggingface
    repo: lightx2v/Qwen-Image-Edit-2511-Lightning
    file: Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
    path: loras

  # Lightning 8-step LoRA V2.0 (bf16, better quality)
  - source: huggingface
    repo: lightx2v/Qwen-Image-Lightning
    file: Qwen-Image-Lightning-8steps-V2.0-bf16.safetensors
    path: loras

  # ---------------------------------------------------------------------------
  # CUSTOM LORAS
  # ---------------------------------------------------------------------------
  # - source: r2
    # key: loras/hk_v1_final.safetensors
    # file: hk_v1_final.safetensors
    # path: loras

# ==============================================================================
# Custom Nodes
# ==============================================================================
# nodes:
  # - repo: https://github.com/ControlAltAI/ComfyUI-ControlAltAI-Nodes

# ==============================================================================
# KSampler Settings Reference (from official workflow)
# ==============================================================================
# |        | Qwen  | Comfy | Lightning LoRA |
# |--------|-------|-------|----------------|
# | Steps  | 40    | 20    | 4              |
# | CFG    | 4.0   | 4.0   | 1.0            |
